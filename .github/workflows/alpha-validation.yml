name: Alpha 1.2 validation

on:
  push:
    branches:
      - fix/v0.2-alpha.1.2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Credential behavior tests
        run: npm run test:credentials
      - name: Alpha structural and secret-scan verification
        run: npm run verify:alpha1
      - name: Production build
        run: npm run build
      - name: Whitespace and patch validation
        run: git diff --check origin/main...HEAD
